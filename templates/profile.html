<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillForge Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#030712;
--surface:#0d1117;
--surface2:#161b22;
--border:rgba(99,210,255,.15);
--cyan:#63d2ff;
--cyan2:#00f5c8;
--pink:#f472b6;
--amber:#fbbf24;
--text:#e2e8f0;
--muted:#64748b;
--font-head:'Exo 2',sans-serif;
--font-mono:'Space Mono',monospace;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
font-family:var(--font-head);
color:var(--text);
overflow-x:hidden;
min-height:100vh;
}

/* ===== BACKGROUND ===== */

canvas{
position:fixed;
inset:0;
z-index:0;
opacity:.35;
}

/* ===== PAGE ===== */

.page{
position:relative;
z-index:1;
min-height:100vh;
}

/* ===== NAV ===== */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:1.4rem 3rem;
border-bottom:1px solid var(--border);
background:rgba(3,7,18,.75);
backdrop-filter:blur(20px);
position:sticky;
top:0;
z-index:50;
}

.logo{
font-size:1.7rem;
font-weight:900;
letter-spacing:2px;
color:var(--cyan);
text-shadow:0 0 20px rgba(99,210,255,.5);
}

.logo span{
color:var(--cyan2);
}

.nav-links{
display:flex;
gap:1rem;
}

.nav-links a{
text-decoration:none;
color:var(--text);
padding:.7rem 1.1rem;
border-radius:10px;
transition:.3s;
font-weight:600;
}

.nav-links a:hover{
background:rgba(99,210,255,.08);
color:var(--cyan);
}

/* ===== HERO ===== */

.hero{
padding:4rem 3rem 2rem;
display:grid;
grid-template-columns:380px 1fr;
gap:2rem;
align-items:start;
}

/* ===== PROFILE CARD ===== */

.profile-card{
background:var(--surface);
border:1px solid var(--border);
border-radius:28px;
padding:2rem;
position:relative;
overflow:hidden;
backdrop-filter:blur(20px);
}

.profile-card::before{
content:'';
position:absolute;
width:280px;
height:280px;
background:radial-gradient(circle,rgba(99,210,255,.12),transparent 70%);
top:-120px;
right:-100px;
}

.avatar-wrapper{
position:relative;
width:170px;
margin:auto;
}

.avatar{
width:170px;
height:170px;
border-radius:50%;
overflow:hidden;
border:4px solid rgba(99,210,255,.25);
background:linear-gradient(135deg,var(--cyan),var(--cyan2));
display:flex;
align-items:center;
justify-content:center;
font-size:4rem;
font-weight:900;
margin:auto;
box-shadow:
0 0 40px rgba(99,210,255,.2),
0 0 80px rgba(99,210,255,.1);
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.upload-btn{
position:absolute;
bottom:10px;
right:5px;
width:45px;
height:45px;
border-radius:50%;
border:none;
background:linear-gradient(135deg,var(--cyan),var(--cyan2));
font-size:1.2rem;
cursor:pointer;
font-weight:700;
box-shadow:0 0 20px rgba(99,210,255,.3);
}

.profile-info{
text-align:center;
margin-top:1.5rem;
}

.profile-info h1{
font-size:2rem;
margin-bottom:.4rem;
}

.profile-info p{
color:var(--muted);
line-height:1.7;
}

/* ===== LEVEL ===== */

.level-box{
margin-top:2rem;
background:rgba(255,255,255,.03);
padding:1.2rem;
border-radius:18px;
border:1px solid rgba(255,255,255,.05);
}

.level-top{
display:flex;
justify-content:space-between;
margin-bottom:.8rem;
}

.progress{
height:12px;
background:#111827;
border-radius:100px;
overflow:hidden;
}

.progress span{
display:block;
height:100%;
border-radius:100px;
background:linear-gradient(135deg,var(--cyan),var(--cyan2));
}

/* ===== RIGHT ===== */

.right{
display:flex;
flex-direction:column;
gap:2rem;
}

/* ===== STATS ===== */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:1rem;
}

.stat{
background:var(--surface);
border:1px solid var(--border);
padding:1.5rem;
border-radius:22px;
text-align:center;
transition:.3s;
}

.stat:hover{
transform:translateY(-5px);
border-color:var(--cyan);
box-shadow:0 0 30px rgba(99,210,255,.08);
}

.stat h2{
font-size:2rem;
color:var(--cyan);
margin-bottom:.5rem;
}

.stat p{
color:var(--muted);
}

/* ===== SECTION CARD ===== */

.section{
background:var(--surface);
border:1px solid var(--border);
border-radius:24px;
padding:2rem;
position:relative;
overflow:hidden;
}

.section::before{
content:'';
position:absolute;
width:250px;
height:250px;
background:radial-gradient(circle,rgba(99,210,255,.08),transparent 70%);
top:-100px;
right:-100px;
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:1.5rem;
}

.section-title h2{
font-size:1.4rem;
}

/* ===== SKILLS ===== */

.skills{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:1rem;
}

.skill{
background:rgba(255,255,255,.03);
padding:1.2rem;
border-radius:18px;
border:1px solid rgba(255,255,255,.05);
transition:.3s;
}

.skill:hover{
background:rgba(99,210,255,.06);
transform:translateY(-4px);
}

.skill-top{
display:flex;
justify-content:space-between;
margin-bottom:.8rem;
}

.skill-icon{
font-size:2rem;
}

/* ===== ACHIEVEMENTS ===== */

.badges{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:1rem;
}

.badge{
background:rgba(255,255,255,.03);
padding:1.2rem;
border-radius:18px;
text-align:center;
border:1px solid rgba(255,255,255,.05);
transition:.3s;
}

.badge:hover{
transform:translateY(-5px);
background:rgba(99,210,255,.08);
}

.badge span{
font-size:2rem;
display:block;
margin-bottom:.7rem;
}

/* ===== BUTTON ===== */

.save-btn{
margin-top:2rem;
padding:1rem 1.5rem;
border:none;
border-radius:14px;
background:linear-gradient(135deg,var(--cyan),var(--cyan2));
font-weight:800;
cursor:pointer;
font-size:1rem;
transition:.3s;
}

.save-btn:hover{
transform:scale(1.03);
}

/* ===== RESPONSIVE ===== */

@media(max-width:1100px){

.hero{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.badges{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:700px){

nav{
padding:1rem 1.5rem;
}

.hero{
padding:2rem 1.5rem;
}

.stats{
grid-template-columns:1fr;
}

.badges{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="page">

<!-- ===== NAV ===== -->

<nav>

<div class="logo">
SKILL<span>FORGE</span>
</div>

<div class="nav-links">
<a href="/dashboard">Dashboard</a>
<a href="/learn/Python">Learn</a>
<a href="/performance">Performance</a>
</div>

</nav>

<!-- ===== HERO ===== -->

<section class="hero">

<!-- LEFT -->

<div class="profile-card">

<div class="avatar-wrapper">

<div class="avatar" id="avatar">

A

</div>

<button class="upload-btn" onclick="document.getElementById('fileInput').click()">
+
</button>

<input 
type="file" 
id="fileInput" 
accept="image/*"
style="display:none"
>

</div>

<div class="profile-info">

<h1 id="user-name">
Alex Johnson
</h1>

<p>
AI-powered learner mastering futuristic skills 🚀
</p>

</div>

<div class="level-box">

<div class="level-top">
<h3>Level 12</h3>
<h3>75%</h3>
</div>

<div class="progress">
<span style="width:75%"></span>
</div>

</div>

<button class="save-btn">
Save Profile
</button>

</div>

<!-- RIGHT -->

<div class="right">

<!-- STATS -->

<div class="stats">

<div class="stat">
<h2 id="xp">1200</h2>
<p>Total XP</p>
</div>

<div class="stat">
<h2 id="streak">7</h2>
<p>Day Streak</p>
</div>

<div class="stat">
<h2 id="skillsCount">5</h2>
<p>Skills</p>
</div>

<div class="stat">
<h2 id="lessons">28</h2>
<p>Lessons</p>
</div>

</div>

<!-- SKILLS -->

<div class="section">

<div class="section-title">
<h2>📚 Learning Skills</h2>
</div>

<div class="skills" id="skills">

</div>

</div>

<!-- BADGES -->

<div class="section">

<div class="section-title">
<h2>🏆 Achievements</h2>
</div>

<div class="badges">

<div class="badge">
<span>🚀</span>
First Step
</div>

<div class="badge">
<span>⚡</span>
XP Hunter
</div>

<div class="badge">
<span>🔥</span>
Dedicated
</div>

<div class="badge">
<span>🏆</span>
Skill Master
</div>

</div>

</div>

</div>

</section>

</div>

<script>

/* ===== BACKGROUND ===== */

const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}

resize();

window.addEventListener('resize',resize);

const particles=[];

for(let i=0;i<130;i++){

particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
vx:(Math.random()-.5)*.4,
vy:(Math.random()-.5)*.4,
a:Math.random()
});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{

p.x+=p.vx;
p.y+=p.vy;

if(p.x<0||p.x>canvas.width)p.vx*=-1;
if(p.y<0||p.y>canvas.height)p.vy*=-1;

ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle=`rgba(99,210,255,${p.a})`;
ctx.fill();

});

requestAnimationFrame(animate);

}

animate();

/* ===== AVATAR UPLOAD ===== */

document.getElementById('fileInput')
.addEventListener('change',function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(ev){

document.getElementById('avatar').innerHTML=
`<img src="${ev.target.result}">`;

localStorage.setItem('sf_avatar',ev.target.result);

}

reader.readAsDataURL(file);

});

/* ===== LOAD SAVED AVATAR ===== */

const savedAvatar=localStorage.getItem('sf_avatar');

if(savedAvatar){

document.getElementById('avatar').innerHTML=
`<img src="${savedAvatar}">`;

}

/* ===== USER ===== */

const userName=localStorage.getItem('sf_name');

if(userName){

document.getElementById('user-name').innerText=userName;

document.getElementById('avatar').innerText=
userName.charAt(0).toUpperCase();

}

/* ===== PROFILE DATA ===== */

async function loadProfile(){

try{

const token=localStorage.getItem('sf_token');

const res=await fetch('/api/dashboard',{

headers:{
'Authorization':'Bearer '+token
}

});

const data=await res.json();

let totalXP=0;

const container=document.getElementById('skills');

container.innerHTML='';

data.forEach(s=>{

totalXP += s.xp;

container.innerHTML += `

<div class="skill">

<div class="skill-top">

<div>
<h3>${s.name}</h3>
<p>${s.progress}% Progress</p>
</div>

<div class="skill-icon">
${s.icon}
</div>

</div>

<div class="progress">
<span style="width:${s.progress}%"></span>
</div>

</div>

`;

});

document.getElementById('xp').innerText=totalXP;
document.getElementById('skillsCount').innerText=data.length;

}catch(err){

console.log(err);

}

}

loadProfile();

</script>

</body>
</html>
